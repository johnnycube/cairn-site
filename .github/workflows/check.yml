# Runs `make check`, the definition of green: HTML/CSS validation, local asset
# references, gitleaks and fleetlint. Deployment stays in .gitea/workflows/deploy.yml.
# Actions are pinned to commit SHAs; Renovate keeps the pins current.
name: check
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # weekly: catches new leak rules and policy drift

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # gitleaks scans the history
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: lts/*
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: gitleaks, pinned and checksum-verified
        env:
          # renovate: datasource=github-releases depName=gitleaks/gitleaks
          GITLEAKS_VERSION: v8.30.1
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          v=${GITLEAKS_VERSION#v}
          base="https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}"
          curl -sSfLO "${base}/gitleaks_${v}_linux_x64.tar.gz"
          curl -sSfL "${base}/gitleaks_${v}_checksums.txt" | grep " gitleaks_${v}_linux_x64.tar.gz$" | sha256sum -c -
          tar -xzf "gitleaks_${v}_linux_x64.tar.gz" -C "$HOME/.local/bin" gitleaks
          rm "gitleaks_${v}_linux_x64.tar.gz"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: fleetlint
        env:
          # renovate: datasource=go depName=github.com/fleetlint/fleetlint
          FLEETLINT_VERSION: v0.4.0
        run: |
          go install "github.com/fleetlint/fleetlint/cmd/fleetlint@${FLEETLINT_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make check
