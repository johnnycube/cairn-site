# CI — sanity-check the static site on every branch and PR. Deployment runs
# ONLY when a v* tag is pushed. There is no build step, so the check verifies
# the page and every locally referenced asset, and the deployed artifact is
# the repo content itself (hidden files and repo docs/tooling excluded). The
# deploy job is imported from johnny/build.
#
# Secrets: the called workflow reads real stored secrets by these exact names
# (Gitea does not deliver values mapped in the caller's `secrets:` block):
#   SSH_SERVER, SSH_USER, SSH_PRIVATE_KEY, SSH_HOST_KEY (user-level) and
#   DEPLOY_REMOTE_PATH (per repo: rsync target path for this site)

name: Check and deploy

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Cancel superseded branch/PR builds; never cancel a tag deploy
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Principle of least privilege
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check page and local assets
        run: |
          test -f index.html
          test -f styles.css
          # every local href/src referenced from index.html must exist;
          # docs.opencairn.org deep links must resolve (follow redirects, fail on 4xx/5xx)
          missing=0
          for ref in $(grep -oE '(href|src)="[^"]+"' index.html \
                       | sed -E 's/^(href|src)="//; s/"$//'); do
            case "$ref" in
              https://docs.opencairn.org*)
                if ! curl -fsSIL -o /dev/null "$ref"; then
                  echo "broken docs link: $ref"
                  missing=1
                fi ;;
              https:*|http:*|\#*|mailto:*|/) ;;
              *)
                if [ ! -f "$ref" ]; then
                  echo "missing asset: $ref"
                  missing=1
                fi ;;
            esac
          done
          exit $missing

      - name: Upload site
        # NOT actions/upload-artifact: the official v4 action detects Gitea
        # as GHES and aborts. This fork is the same action with that check removed.
        # Hidden files (.git*, .gitea) are excluded by the action's default.
        uses: https://github.com/christopherhx/gitea-upload-artifact@81f940d004763f986ba3582c007fd842dd5cb0d7 # v4
        with:
          name: site
          path: |
            .
            !README.md
            !CONTRIBUTING.md
            !SECURITY.md
            !Makefile
            !docs/**
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: check
    # Deploy only on v* release tags — never from branches or PRs.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: johnny/build/.gitea/workflows/deploy-static-page.yaml@2516402e0d1316ba94465c7574e6a3d3042712c6 # v11
    with:
      artifact-name: site
    secrets:
      SSH_SERVER: ${{ secrets.DEPLOY_SSH_HOST }}
      SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
      DEPLOY_REMOTE_PATH: ${{ secrets.DEPLOY_REMOTE_PATH }}
