# CI — sanity-check the static site on every branch and PR. Deployment runs
# ONLY when a v* tag is pushed. There is no build step, so the check verifies
# the page and every locally referenced asset, and the deployed artifact is
# the repo content itself (hidden files and README excluded). The deploy job
# is imported from johnny/build.
#
# Secrets needed (user-level JOHNNY_ALL_INKL_* plus per-repo):
#   JOHNNY_ALL_INKL_SSH_HOST, JOHNNY_ALL_INKL_SSH_USER,
#   JOHNNY_ALL_INKL_PRIVATE_KEY, JOHNNY_ALL_INKL_HOST_KEY,
#   DEPLOY_REMOTE_PATH (rsync target path for this site)

name: Check and deploy

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Cancel superseded branch/PR builds; never cancel a tag deploy
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Principle of least privilege
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check page and local assets
        run: |
          test -f index.html
          test -f styles.css
          # every local href/src referenced from index.html must exist
          missing=0
          for ref in $(grep -oE '(href|src)="[^"]+"' index.html \
                       | sed -E 's/^(href|src)="//; s/"$//' \
                       | grep -vE '^(https?:|#|mailto:|\/$)'); do
            if [ ! -f "$ref" ]; then
              echo "missing asset: $ref"
              missing=1
            fi
          done
          exit $missing

      - name: Upload site
        # NOT actions/upload-artifact: the official v4 action detects Gitea
        # as GHES and aborts. This fork is the same action with that check removed.
        # Hidden files (.git*, .gitea) are excluded by the action's default.
        uses: https://github.com/christopherhx/gitea-upload-artifact@v4
        with:
          name: site
          path: |
            .
            !README.md
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: check
    # Deploy only on v* release tags — never from branches or PRs.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: johnny/build/.gitea/workflows/deploy-static-page.yaml@v9
    with:
      artifact-name: site
    secrets:
      SSH_SERVER: ${{ secrets.JOHNNY_ALL_INKL_SSH_HOST }}
      SSH_USER: ${{ secrets.JOHNNY_ALL_INKL_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.JOHNNY_ALL_INKL_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.JOHNNY_ALL_INKL_HOST_KEY }}
      DEPLOY_REMOTE_PATH: ${{ secrets.DEPLOY_REMOTE_PATH }}
